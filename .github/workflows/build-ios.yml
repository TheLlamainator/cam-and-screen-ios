name: Build iOS App

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project CamAndScreen.xcodeproj \
            -scheme CamAndScreen \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            clean build

      - name: Package simulator build
        run: |
          cd build-sim/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/CamAndScreen-Simulator.zip" CamAndScreen.app

      - name: Build unsigned app for device
        run: |
          xcodebuild \
            -project CamAndScreen.xcodeproj \
            -scheme CamAndScreen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build-device/Build/Products/Release-iphoneos/CamAndScreen.app Payload/
          zip -r CamAndScreen-unsigned.ipa Payload

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamAndScreen-builds
          path: |
            CamAndScreen-Simulator.zip
            CamAndScreen-unsigned.ipa
          retention-days: 30

      - name: Publish latest build as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes || true
          git push origin :refs/tags/latest-build || true
          gh release create latest-build \
            CamAndScreen-Simulator.zip \
            CamAndScreen-unsigned.ipa \
            --title "Latest build ($(date -u +%Y-%m-%d_%H-%M-%SZ))" \
            --notes "Automated build from commit ${{ github.sha }}. CamAndScreen-unsigned.ipa needs to be re-signed (e.g. with Sideloadly or AltStore) before installing on a device." \
            --target ${{ github.sha }}
